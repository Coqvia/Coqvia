<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coqvia – E-Mail bestätigt</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef9f4 0%, #fff 100%);
      color: #1a1a1a;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(46, 204, 113, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .checkmark {
      width: 44px;
      height: 44px;
      stroke: #2ecc71;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      color: #555;
      line-height: 1.55;
      margin: 0 0 28px;
      font-size: 1rem;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #d97c4a;
      color: #fff;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(217, 124, 74, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover, .btn:focus {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(217, 124, 74, 0.4);
    }
    .hint {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #888;
    }
    .logo {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #d97c4a;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Coqvia</div>
    <div class="icon">
      <svg class="checkmark" viewBox="0 0 52 52">
        <path d="M14 27 L23 36 L40 18" />
      </svg>
    </div>
    <h1>E-Mail bestätigt!</h1>
    <p>Dein Account wurde erfolgreich verifiziert. Du kannst dich jetzt in der Coqvia-App anmelden und mit dem Sammeln deiner Rezepte starten.</p>
    <a class="btn" href="coqvia://login">Coqvia öffnen</a>
    <div class="hint">Falls die App sich nicht öffnet, starte sie manuell und melde dich an.</div>
  </div>
</body>
</html>
